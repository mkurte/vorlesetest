<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Open book -->
  <path d="M8 18 C8 16 10 14 12 14 L30 14 C31 14 32 15 32 16 L32 50 C32 49 31 48 30 48 L12 48 C10 48 8 46 8 44 Z" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1.5"/>
  <path d="M56 18 C56 16 54 14 52 14 L34 14 C33 14 32 15 32 16 L32 50 C32 49 33 48 34 48 L52 48 C54 48 56 46 56 44 Z" fill="#5BA0E6" stroke="#2C5F8A" stroke-width="1.5"/>
  <!-- Book spine -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#2C5F8A" stroke-width="1.5"/>
  <!-- Page lines left -->
  <line x1="14" y1="22" x2="28" y2="22" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <line x1="14" y1="27" x2="28" y2="27" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <line x1="14" y1="32" x2="28" y2="32" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <!-- Page lines right -->
  <line x1="36" y1="22" x2="50" y2="22" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <line x1="36" y1="27" x2="50" y2="27" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <line x1="36" y1="32" x2="50" y2="32" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <!-- Speech bubble with tail as single path -->
  <path d="M38 2 L56 2 C58.2 2 60 3.8 60 6 L60 16 C60 18.2 58.2 20 56 20 L42 20 L36 26 L38 20 C35.8 20 34 18.2 34 16 L34 6 C34 3.8 35.8 2 38 2 Z" fill="#F5E6C8" stroke="#C4A96A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Text dots in bubble (symbolizing speech) -->
  <circle cx="41" cy="11" r="2" fill="#8B7355"/>
  <circle cx="47" cy="11" r="2" fill="#8B7355"/>
  <circle cx="53" cy="11" r="2" fill="#8B7355"/>
</svg>
