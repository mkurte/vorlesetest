<h1>Vorlesetest</h1>

<label for="words">Wörter (ein Wort pro Zeile)</label>
<textarea
  id="words"
  rows="10"
  [ngModel]="vm().wordsInput.value"
  (ngModelChange)="vm().wordsInput.onChange($event)"
  placeholder="Hund&#10;Katze&#10;Maus&#10;..."
></textarea>

<fieldset>
  <legend>Zeit</legend>
  <div class="time-inputs">
    <label for="minutes">Minuten</label>
    <input
      id="minutes"
      type="number"
      min="0"
      max="59"
      [ngModel]="vm().minutes.value"
      (ngModelChange)="vm().minutes.onChange($event)"
    />
    <span aria-hidden="true">:</span>
    <label for="seconds">Sekunden</label>
    <input
      id="seconds"
      type="number"
      min="0"
      max="59"
      [ngModel]="vm().seconds.value"
      (ngModelChange)="vm().seconds.onChange($event)"
    />
  </div>
</fieldset>

<div class="actions">
  <button type="button" [disabled]="!vm().canStart" (click)="vm().shuffle()">Wörter mischen</button>
  <button type="button" [disabled]="!vm().canStart" (click)="vm().start()">Start</button>
</div>
